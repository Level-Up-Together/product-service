spring:
  # LUT-545: @Scheduled 스레드풀 — 기본값 1 이면 9개 잡이 한 스레드에서 직렬화되어 긴 잡이 매분 틱(아이템 푸시)을 지연·유실시킨다
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: sched-
  application:
    name: product-service
  # LUT-595: Boot 의 Flyway 자동설정은 DB 하나(primary)만 다루므로 끈다 — 9개 DB 는 app.flyway 로 직접 관리(FlywayMigration)
  flyway:
    enabled: false
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8443

# LUT-615: HTTP 요청 지연 p95/p99 용 히스토그램 — percentiles-histogram(버킷 ~70개 × uri·status 조합)은 Grafana Cloud Free
# 활성 시리즈 한도(1만)를 넘기므로 SLO 경계 4개(+Inf 포함 버킷 5개)만 노출한다. Grafana 는 histogram_quantile 로 추정(경계 사이는 선형 보간).
management:
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 100ms,300ms,1s,3s

logging:
  config: classpath:slf4j/logback-spring-local.xml

encrypt:
  key: key-brian

app:
  # 사용자 정책 (QA-115)
  # withdrawal.cool-down-days: 회원탈퇴 후 동일 이메일로 재가입 가능해지는 기간(일).
  # 운영 중 정책 변경 시 config-repository 의 product-service-prod.yml 등에서 override.
  user:
    withdrawal:
      cool-down-days: 7

  dev-config-server-ip: 121.136.108.44
  dev-discovery-server-ip: 121.136.108.44
  dev-db-server-ip: 121.136.108.44

  prod-config-server-ip: 10.0.1.236 #10.0.1.124
  prod-discovery-server-ip: 10.0.1.236 #10.0.1.124
  prod-db-server-ip: lut-postgres.c1wegq0a4s9l.ap-northeast-2.rds.amazonaws.com

  # LUT-595: Flyway (db/migration/<db>/). 기본 off — dev 는 config-repository 에서 on, prod 는 v1.1.3 운영 배포 뒤 v1.1.4 부터 on.
  # baseline-version = 이미 수동으로 적용한 마지막 SQL 버전 (1.1.3 V007 → 1.1.3.7). history 표가 없는 DB 에 이 버전의 baseline 행을 만든다.
  flyway:
    enabled: false
    baseline-version: 1.1.3.7

  # LUT-593: 레벨 도달 보상 아이템. sprout-item-id 는 환경별 shop_item_id (dev 6 / prod 15 — config-repository 에서 설정).
  # 비어 있으면 지급하지 않는다.
  level-reward:
    sprout-level: 5
    sprout-item-id:
  upload:
    profile-image:
      path: ${user.dir}/uploads/profile
      max-size: 5242880
      allowed-extensions: jpg,jpeg,png,gif,webp
      url-prefix: /uploads/profile
    mission-image:
      path: ${user.dir}/uploads/missions
      max-size: 5242880
      allowed-extensions: jpg,jpeg,png,gif,webp
      url-prefix: /uploads/missions
    chat-image: # LUT-590 길드 채팅·DM 이미지 (prod 는 S3 chats/ 키)
      path: ${user.dir}/uploads/chats
      max-size: 5242880
      allowed-extensions: jpg,jpeg,png,gif,webp
      url-prefix: /uploads/chats
    s3:
      bucket: ""
      cdn-base-url: ""

# 이미지 검증 설정
# provider: none (기본값, 검증 비활성화), onnx-nsfw (비용 절감), aws-rekognition (운영용)
moderation:
  image:
    provider: none
    min-confidence: 80.0
    blocked-categories:
      - Explicit Nudity
      - Violence
      - Visually Disturbing
      - Hate Symbols
    aws:
      region: ap-northeast-2
    onnx:
      model-path: classpath:models/nsfw.onnx
      nsfw-threshold: 0.8

# Google Cloud Translation API 설정
# enabled: true로 설정하면 번역 기능 활성화
# api.key: Google Cloud Console에서 발급받은 API Key
google:
  translation:
    enabled: false
    api:
      url: https://translation.googleapis.com
      key: ${GOOGLE_TRANSLATION_API_KEY:}

# 미션 수행 설정
# mission.execution 설정은 MissionExecutionProperties.java 기본값 사용
# max-execution-minutes: 240, base-exp: 120, warning-minutes-after-start: [180, 230]

# Firebase 푸시 알림 설정
# enabled: true로 설정하면 FCM 푸시 알림 활성화
# credentials.path: classpath 내 서비스 계정 파일 경로 (로컬 개발용)
# credentials.json: 서비스 계정 JSON 문자열 (배포 환경용, 환경변수로 주입)
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials:
    path: firebase-service-account.json
    json: ${FIREBASE_CREDENTIALS_JSON:}
